name: Android Local CI

on:
  push:
    branches:
      - restore-local-updater-code8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build and verify Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare offline game
        run: pnpm prepare:game

      - name: Stage Android game assets
        run: pnpm stage:android

      - name: Compile Android APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            -PpokebonkVersionCode=9 \
            -PpokebonkVersionName=0.0.24 \
            assembleDebug

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          test -s "$APK"

          "$AAPT" dump badging "$APK" | grep -F \
            "name='dev.vdustr.pokebonk.offline.local' versionCode='9' versionName='0.0.24'"

          "$SIGNER" verify --print-certs "$APK"

          sha256sum "$APK"

          echo "### Android CI passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: 0.0.24" >> "$GITHUB_STEP_SUMMARY"
          echo "- VersionCode: 9" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: dev.vdustr.pokebonk.offline.local" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compilation: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK upload: disabled" >> "$GITHUB_STEP_SUMMARY"